<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Адмінпанель Злі Бороди</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d10616'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3EЗБ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="logo">Злі <span>Бороди</span></div>
    <div class="login-sub">Адмінпанель сайту</div>
    <div class="login-box">
      <h1>Вхід</h1>
      <p id="loginText">Увійдіть через Google-акаунт, якому відкрито доступ до адмінки</p>
      <div id="loginErr" class="login-err" hidden></div>
      <div id="gbtn"></div>
      <form id="devForm" hidden style="display:grid;gap:8px;width:100%">
        <input class="in" id="devEmail" type="email" placeholder="Пошта для локального входу">
        <button class="btn btn-red" type="submit">Увійти локально</button>
      </form>
    </div>
    <div class="login-note">Доступ лише для адміністраторів сайту</div>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <a class="logo" href="/" target="_blank" rel="noopener" title="Відкрити сайт">Злі <span>Бороди</span></a>
    <span class="top-sub">Адмінпанель</span>
    <div class="status" id="status"><i></i><span>Завантаження</span></div>
    <div class="top-act">
      <a class="ul" href="/" target="_blank" rel="noopener">Відкрити сайт</a>
      <button class="btn btn-line pv-toggle" id="pvToggle" type="button">Перегляд</button>
      <button class="btn btn-line" id="discard" type="button" disabled>Скасувати зміни</button>
      <button class="btn btn-red" id="publish" type="button" disabled>Опублікувати</button>
      <div class="me">
        <button class="me-btn" id="meBtn" type="button" aria-label="Акаунт"></button>
        <div class="menu" id="meMenu" hidden>
          <div class="menu-h"><b id="meName"></b><small id="meEmail"></small></div>
          <button type="button" data-go="admins">Адміністратори</button>
          <button type="button" data-go="history">Історія змін</button>
          <button type="button" id="logout">Вийти</button>
        </div>
      </div>
    </div>
  </header>

  <aside class="side" id="side"></aside>

  <main class="editor" id="editor"><div class="ed-in" id="edIn"></div></main>

  <section class="preview" id="preview" aria-label="Перегляд сайту">
    <div class="pv-banner" id="pvBanner" hidden></div>
    <div class="pv-bar">
      <div class="pv-path"><span class="pv-dot"></span><b id="pvPath">Головна</b></div>
      <div class="seg" role="group" aria-label="Пристрій">
        <button type="button" data-dev="desktop" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Комп'ютер</button>
        <button type="button" data-dev="mobile"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Телефон</button>
      </div>
      <button class="icon-btn" id="pvReload" type="button" title="Оновити перегляд"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="icon-btn pv-close" id="pvClose" type="button" title="Закрити перегляд"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pv-stage" id="pvStage">
      <div class="pv-box" id="pvBox">
        <iframe id="pvA" title="Перегляд сайту" sandbox="allow-scripts"></iframe>
        <iframe id="pvB" class="back" title="Перегляд сайту" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts"></div>
<script src="/admin/admin.js" type="module"></script>
</body>
</html>
